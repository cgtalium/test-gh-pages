name: 2Update dashboard

on:
  workflow_dispatch:        # только кнопка «Run workflow»

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pyyaml

      - name: Commit data
        run:
          git config user.name "dashboard-bot"
