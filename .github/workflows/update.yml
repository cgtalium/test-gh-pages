name: Update dashboard

on:
  workflow_dispatch:        # только кнопка «Run workflow», никаких cron

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pyyaml

      - name: Collect data
        run: |
          git clone --filter=blob:none https://github.com/pnedev/comparePlus.git _src/comparePlus
          python collect.py

      - name: Commit data
        run: |
          git config user.name "dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "chore: update dashboard data [skip ci]" || echo "no changes"
          git push
